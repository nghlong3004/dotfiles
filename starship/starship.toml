[zig]
format = '[$symbol]($style)( [$version](fg:color_white)) '
version_format = '${major}.${minor}'
style = "fg:#F7A41D"
symbol = ""

# Starship 1.22.1 has no built-in uv, pnpm, or Maven module.
[custom.uv]
description = "uv version"
detect_files = ["uv.lock"]
command = """uv --version 2>/dev/null | awk '$1 == "uv" && $2 ~ /^[0-9]+[.][0-9]+/ { split($2, v, "."); print v[1] "." v[2]; exit }'"""
shell = ["sh"]
format = '([$symbol]($style) [$output](fg:color_white) )'
style = "fg:#DE5FE9"
symbol = "uv"

[custom.pnpm]
description = "pnpm version"
detect_files = ["pnpm-lock.yaml"]
command = """COREPACK_ENABLE_NETWORK=0 pnpm --version 2>/dev/null | awk '/^[0-9]+[.][0-9]+/ { split($0, v, "."); print v[1]; exit }'"""
shell = ["sh"]
format = '([$symbol]($style) [$output](fg:color_white) )'
style = "fg:#F69220"
symbol = ""

[custom.maven]
description = "Maven version"
detect_files = ["pom.xml"]
command = """mvn --version -Dstyle.color=never 2>/dev/null | awk '$1 == "Apache" && $2 == "Maven" && $3 ~ /^[0-9]+[.][0-9]+/ { split($3, v, "."); print v[1] "." v[2]; exit }'"""
shell = ["sh"]
format = '([$symbol]($style) [$output](fg:color_white) )'
style = "fg:#C71A36"
symbol = ""

